name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: cd voice_app && flutter pub get
      - run: cd voice_app && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ai-pro-voice-app
          path: voice_app/build/app/outputs/flutter-apk/app-debug.apk
